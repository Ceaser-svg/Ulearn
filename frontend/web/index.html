<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    SPA routing: this app routes on the client, so a static host that serves
    files literally will 404 on any deep link or refresh (`/sessions/123`).
    Nothing in this repository can fix that, because the behaviour belongs to
    the host. The host must serve index.html for any path that is not a real
    file — nginx `try_files $uri $uri/ /index.html;`, Netlify/Vercel/Firebase
    a rewrite of `/*` to `/index.html`, Apache `FallbackResource /index.html`,
    or a GitHub Pages 404.html that redirects to the base path.

    Recorded in docs/MUST_Pilot_Operations.md. Do not "fix" a 404 by adding real
    directories here; that produces a site where only the routes that happen to
    have a directory survive.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PeerPass connects university students with verified peer tutors for focused, stigma-free academic support.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PeerPass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PeerPass</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
